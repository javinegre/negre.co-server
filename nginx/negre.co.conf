# negre.co nginx config — tracked source of truth.
#
# NOTE: this was authored from the README's documented gzip settings and the
# app's known routes, NOT pulled from the live server (no SSH access from
# this session). Before applying on the new droplet, diff this against the
# real config on the old one (`sudo nginx -T`) and reconcile — particularly
# the gzip_types list and any SSL/cert directives, which were never checked
# into version control anywhere prior to this file existing.

server {
    listen 80;
    listen [::]:80;
    server_name negre.co www.negre.co;
    return 301 https://negre.co$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name negre.co www.negre.co;

    # ssl_certificate / ssl_certificate_key — set per Decision Point #8
    # (carry over existing commercial cert, or issue fresh via certbot)

    gzip on;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --- zero-risk static wins: nginx serves directly, bypasses Node ---
    location /files/ {
        alias /home/javi/negre.co-server/public-files/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /.well-known/ {
        alias /home/javi/negre.co-server/well-known-folder/;
    }

    # --- bicing-2023 static SPA build; /bicing/api/ stays dynamic (proxied) ---
    location /bicing/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bicing/ {
        alias /home/javi/negre.co-server/apps/bicing-2023/dist/;
        try_files $uri $uri/ =404;
        expires 7d;
    }

    # --- bicing-2021 static build ---
    location /bicing-2021/ {
        alias /home/javi/negre.co-server/apps/bicing-2021/build/;
        try_files $uri $uri/ =404;
        expires 7d;
    }

    # --- retired app: redirect old bookmarks/links to its successor ---
    location /bicing-vue/ {
        return 301 /bicing/;
    }

    # everything else (home app: /, /des, /cv, custom 404; /slides/) stays
    # proxied to Node — home is the catch-all route with real routing logic,
    # not worth the nginx-config risk to peel off separately
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

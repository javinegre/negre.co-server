# negre.co nginx config — tracked source of truth.
#
# Deployed and verified live on negre-co--ams3-26. Matches the actual
# /etc/nginx/sites-available/negre.co.conf on that droplet as of the PM2/tsx
# migration. Notes:
#
# - SSL is Certbot-managed (Let's Encrypt), not the old manual/commercial
#   cert process — covers negre.co, www.negre.co, and javi.negre.co.
# - /.well-known/ deliberately stays proxied to Node (not a static alias):
#   Certbot's nginx plugin may need to write ACME HTTP-01 challenge files
#   under /.well-known/acme-challenge/ during renewal, and a static alias
#   here risks shadowing that and silently breaking auto-renewal.
# - Static aliases need www-data (the nginx worker user) to have read+execute
#   on the whole /home/javi/negre.co-server tree, which isn't true by default
#   (home dirs are 750). Set once via ACL, with a default ACL so future
#   deploys inherit it automatically:
#     setfacl -m g:www-data:x /home/javi
#     setfacl -R -m g:www-data:rx /home/javi/negre.co-server
#     setfacl -R -d -m g:www-data:rx /home/javi/negre.co-server

server {

    server_name negre.co www.negre.co javi.negre.co;

    location /files/ {
        alias /home/javi/negre.co-server/public-files/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /bicing/api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bicing/ {
        alias /home/javi/negre.co-server/apps/bicing-2023/dist/;
        try_files $uri $uri/ =404;
        expires 7d;
    }

    location /bicing-2021/ {
        alias /home/javi/negre.co-server/apps/bicing-2021/build/;
        try_files $uri $uri/ =404;
        expires 7d;
    }

    # retired app: redirect old bookmarks/links to its successor
    location /bicing-vue/ {
        return 301 /bicing/;
    }

    # everything else (home app: /, /des, /cv, custom 404; /slides/;
    # /.well-known/) stays proxied to Node
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        index index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/negre.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/negre.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = javi.negre.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.negre.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = negre.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name negre.co www.negre.co javi.negre.co;
    return 404; # managed by Certbot
}
